spring.application.name=spacework-backend
server.port=8080

# SQL Server (crear antes una base de datos vacia llamada "spacework")
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=spacework;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:cambiar_clave}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
